name: knoviq

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: knoviq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knoviq}
      POSTGRES_USER: ${POSTGRES_USER:-knoviq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knoviq_dev_password}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres18-data:/var/lib/postgresql
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knoviq} -d ${POSTGRES_DB:-knoviq}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    container_name: knoviq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: apache/kafka:4.3.0
    container_name: knoviq-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Application services (profile: app) ────────────────────────────────────
  # Start with: docker compose --profile app up -d
  # Or together with infra: docker compose --profile app up -d

  auth-service:
    profiles: ["app"]
    image: knoviq/auth-service:0.1.0
    container_name: knoviq-auth
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE_PACKAGE: "@knoviq/auth-service"
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT:-4001}:4001"
    env_file: .env
    environment:
      AUTH_SERVICE_PORT: "4001"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-knoviq}:${POSTGRES_PASSWORD:-knoviq_dev_password}@postgres:5432/${POSTGRES_DB:-knoviq}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  knowledge-service:
    profiles: ["app"]
    image: knoviq/knowledge-service:0.1.0
    container_name: knoviq-knowledge
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE_PACKAGE: "@knoviq/knowledge-service"
    restart: unless-stopped
    ports:
      - "${KNOWLEDGE_SERVICE_PORT:-4003}:4003"
    env_file: .env
    environment:
      KNOWLEDGE_SERVICE_PORT: "4003"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-knoviq}:${POSTGRES_PASSWORD:-knoviq_dev_password}@postgres:5432/${POSTGRES_DB:-knoviq}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    volumes:
      - knowledge-uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  tool-execution-service:
    profiles: ["app"]
    image: knoviq/tool-execution-service:0.1.0
    container_name: knoviq-tools
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE_PACKAGE: "@knoviq/tool-execution-service"
    restart: unless-stopped
    ports:
      - "${TOOL_EXECUTION_SERVICE_PORT:-4004}:4004"
    env_file: .env
    environment:
      TOOL_EXECUTION_SERVICE_PORT: "4004"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-knoviq}:${POSTGRES_PASSWORD:-knoviq_dev_password}@postgres:5432/${POSTGRES_DB:-knoviq}
      KAFKA_BROKERS: kafka:9092
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:4003
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      knowledge-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  ai-gateway:
    profiles: ["app"]
    image: knoviq/ai-gateway:0.1.0
    container_name: knoviq-ai-gateway
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      args:
        SERVICE_PACKAGE: "@knoviq/ai-gateway"
    restart: unless-stopped
    ports:
      - "${AI_GATEWAY_PORT:-4002}:4002"
    env_file: .env
    environment:
      AI_GATEWAY_PORT: "4002"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-knoviq}:${POSTGRES_PASSWORD:-knoviq_dev_password}@postgres:5432/${POSTGRES_DB:-knoviq}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      TOOL_EXECUTION_SERVICE_URL: http://tool-execution-service:4004
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      tool-execution-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  # web starts as soon as auth-service is healthy.
  # The other three backends (ai-gateway, knowledge, tools) are called lazily
  # on user action — there's no benefit waiting for them at container startup.
  # This cuts cold-start time by ~45-60 seconds.
  web:
    profiles: ["app"]
    image: knoviq/web:0.1.0
    container_name: knoviq-web
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file: .env
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-service:4001
      AI_GATEWAY_URL: http://ai-gateway:4002
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:4003
      TOOL_EXECUTION_SERVICE_URL: http://tool-execution-service:4004
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  postgres18-data:
  redis-data:
  kafka-data:
  knowledge-uploads:
