apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knowledge-uploads
  namespace: knoviq
  labels:
    app.kubernetes.io/name: knowledge-service
    app.kubernetes.io/part-of: knoviq
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: knoviq
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: knoviq
spec:
  ports:
    - name: http
      port: 4001
      targetPort: http
  selector:
    app.kubernetes.io/name: auth-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: knoviq
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: knoviq
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: knoviq
    spec:
      containers:
        - name: auth-service
          image: knoviq/auth-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4001
          envFrom:
            - configMapRef:
                name: knoviq-config
            - secretRef:
                name: knoviq-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
