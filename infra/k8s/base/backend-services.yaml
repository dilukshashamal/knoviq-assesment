apiVersion: v1
kind: Service
metadata:
  name: knowledge-service
  namespace: knoviq
  labels:
    app.kubernetes.io/name: knowledge-service
    app.kubernetes.io/part-of: knoviq
spec:
  ports:
    - name: http
      port: 4003
      targetPort: http
  selector:
    app.kubernetes.io/name: knowledge-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-service
  namespace: knoviq
  labels:
    app.kubernetes.io/name: knowledge-service
    app.kubernetes.io/part-of: knoviq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-service
        app.kubernetes.io/part-of: knoviq
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: knowledge-service
          image: knoviq/knowledge-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4003
          envFrom:
            - configMapRef:
                name: knoviq-config
            - secretRef:
                name: knoviq-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: uploads
              mountPath: /var/lib/knoviq/uploads
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: knowledge-uploads
---
