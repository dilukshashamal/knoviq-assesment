apiVersion: v1
kind: Secret
metadata:
  name: knoviq-secrets
  namespace: knoviq
  labels:
    app.kubernetes.io/part-of: knoviq
type: Opaque
stringData:
  DATABASE_URL: postgresql://knoviq:replace-me@postgres:5432/knoviq
  POSTGRES_PASSWORD: replace-me
  JWT_ACCESS_SECRET: replace-with-at-least-32-characters
  JWT_REFRESH_SECRET: replace-with-at-least-32-characters
  JWT_ISSUER: knoviq-auth-service
  JWT_AUDIENCE: knoviq-api
  AZURE_OPENAI_ENDPOINT: https://replace-me.openai.azure.com/
  AZURE_OPENAI_API_KEY: replace-me
  AZURE_OPENAI_API_VERSION: 2025-04-01-preview
  AZURE_OPENAI_CHAT_DEPLOYMENT_FAST: replace-me
  AZURE_OPENAI_CHAT_DEPLOYMENT_REASONING: replace-me
  AZURE_OPENAI_EMBEDDING_DEPLOYMENT: replace-me
  AZURE_OPENAI_EMBEDDING_DIMENSIONS: "1536"
